[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arca-sentry"
version = "0.1.0"
description = "Continuous compliance auditing for enterprise AI systems"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "B Drive IT", email = "ealtamira@b-drive.com.mx" }]
keywords = ["ai", "compliance", "audit", "eu-ai-act", "gdpr", "multi-agent"]

dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",

    # Async + HTTP
    "httpx>=0.27",
    "websockets>=12.0",
    "aiofiles>=24.0",

    # Database
    "asyncpg>=0.29",
    "aiosqlite>=0.20",

    # AI SDKs
    "google-genai>=0.3",          # Gemini Pro
    "speechmatics-python>=2.0",   # Speechmatics streaming STT

    # Templating + reports
    "jinja2>=3.1",
    "weasyprint>=62.0",
    "markdown>=3.6",

    # Utilities
    "structlog>=24.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]

[project.scripts]
sentry-api = "api.main:run"
sentry-orchestrator = "core.orchestrator:run"
sentry-voice-tap = "capture.voice_tap:run"

[project.urls]
Homepage = "https://github.com/bdriveit/arca-sentry"
Repository = "https://github.com/bdriveit/arca-sentry"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "agents*", "capture*", "synthesizer*", "adapters*", "api*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C90", "N", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
